name: Bootstrap OBS package

# Run this once, manually, to create the OBS project/package and push the
# initial spec + sources. After this, helium-obs-sync.yml keeps it updated.
on:
  workflow_dispatch: {}

env:
  OBS_PROJECT: home:pancakse
  OBS_PACKAGE: helium-browser-bin
  UPSTREAM_REPO: imputnet/helium-linux
  HELIUM_GPG_FPR: BE677C1989D35EAB2C5F26C9351601AD01D6378E

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout packaging repo
        uses: actions/checkout@v4

      - name: Install osc
        run: sudo apt-get update && sudo apt-get install -y osc

      - name: Configure osc credentials
        env:
          OBS_USERNAME: ${{ secrets.OBS_USERNAME }}
          OBS_PASSWORD: ${{ secrets.OBS_PASSWORD }}
        run: |
          mkdir -p ~/.config/osc
          cat > ~/.config/osc/oscrc <<EOF
          [general]
          apiurl = https://api.opensuse.org

          [https://api.opensuse.org]
          user = ${OBS_USERNAME}
          pass = ${OBS_PASSWORD}
          EOF
          chmod 600 ~/.config/osc/oscrc

      - name: Create/update project meta
        run: |
          cat > project-meta.xml <<EOF
          <project name="${OBS_PROJECT}">
            <title>Pancakse's packages</title>
            <description/>
            <person userid="${{ secrets.OBS_USERNAME }}" role="maintainer"/>
            <repository name="openSUSE_Tumbleweed">
              <path project="openSUSE:Factory" repository="snapshot"/>
              <arch>x86_64</arch>
            </repository>
          </project>
          EOF
          osc meta prj "${OBS_PROJECT}" -F project-meta.xml

      - name: Create/update package meta
        run: |
          cat > package-meta.xml <<EOF
          <package name="${OBS_PACKAGE}" project="${OBS_PROJECT}">
            <title>Helium Browser (prebuilt binary)</title>
            <description>Repackaged prebuilt Helium browser tarball for openSUSE.</description>
          </package>
          EOF
          osc meta pkg "${OBS_PROJECT}" "${OBS_PACKAGE}" -F package-meta.xml

      - name: Get latest upstream release
        id: upstream
        run: |
          latest=$(curl -fsSL "https://api.github.com/repos/${UPSTREAM_REPO}/releases/latest" | jq -r '.tag_name')
          echo "version=$latest" >> "$GITHUB_OUTPUT"

      - name: Download tarball + signature
        run: |
          v="${{ steps.upstream.outputs.version }}"
          base="https://github.com/${UPSTREAM_REPO}/releases/download/${v}"
          curl -fsSLo "helium-${v}-x86_64_linux.tar.xz" "${base}/helium-${v}-x86_64_linux.tar.xz"
          curl -fsSLo "helium-${v}-x86_64_linux.tar.xz.asc" "${base}/helium-${v}-x86_64_linux.tar.xz.asc"

      - name: Verify GPG signature
        run: |
          curl -fsSL https://raw.githubusercontent.com/imputnet/helium-linux/main/pubkey.asc -o helium_pub.asc
          gpg --show-key --with-colons helium_pub.asc | grep -q "${HELIUM_GPG_FPR}"
          gpg --import helium_pub.asc
          gpg --trusted-key "${HELIUM_GPG_FPR: -16}" \
              --verify "helium-${{ steps.upstream.outputs.version }}-x86_64_linux.tar.xz.asc" \
                       "helium-${{ steps.upstream.outputs.version }}-x86_64_linux.tar.xz"

      - name: Set spec version to match downloaded release
        run: |
          v="${{ steps.upstream.outputs.version }}"
          sed -i "s/^%global pkgver .*/%global pkgver ${v}/" helium-browser-bin.spec
          sed -i "s|^Source0:.*|Source0:        https://github.com/${UPSTREAM_REPO}/releases/download/${v}/helium-${v}-x86_64_linux.tar.xz|" helium-browser-bin.spec

      - name: Checkout OBS package and push initial files
        run: |
          v="${{ steps.upstream.outputs.version }}"
          osc checkout "${OBS_PROJECT}/${OBS_PACKAGE}" -o obs-checkout
          cp helium-browser-bin.spec helium-browser.desktop helium-browser-wrapper obs-checkout/
          cp "helium-${v}-x86_64_linux.tar.xz" obs-checkout/
          cd obs-checkout
          osc addremove
          osc commit -m "Initial import: helium-browser-bin ${v}"

      - name: Commit spec bump back to this repo
        run: |
          git config user.name "helium-sync-bot"
          git config user.email "actions@syrupstudios.dev"
          git add helium-browser-bin.spec
          git diff --cached --quiet || git commit -m "helium: initial bootstrap at ${{ steps.upstream.outputs.version }}"
          git push
          